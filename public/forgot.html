<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>비밀번호 찾기 | 전세지킴단</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-login">
  <main class="login-wrap">
    <section class="login-card">
      <div class="login-head">
        <h1 class="login-title">비밀번호 찾기</h1>
        <p class="login-sub">가입한 이메일로 임시 비밀번호를 발급합니다.</p>
      </div>

      <form id="forgotForm" class="login-form">
        <div class="field">
          <label for="email">이메일</label>
          <input id="email" type="email" placeholder="name@example.com" required />
        </div>

        <button class="login-btn" type="submit">임시 비밀번호 발급</button>

        <p class="login-foot">
          <a class="link strong" href="/login?embed=1">로그인으로 돌아가기</a>
        </p>

        <div id="msg" class="login-msg" hidden></div>
      </form>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    if(params.get("embed") === "1"){
      document.body.style.paddingTop = "0";
      document.querySelector(".login-wrap").style.paddingTop = "24px";
    }

    async function api(url, opts){
      const r = await fetch(url, {
        headers: { "Content-Type":"application/json" },
        credentials: "include",
        ...opts
      });
      const data = await r.json().catch(()=> ({}));
      if(!r.ok) throw new Error(data.message || "request failed");
      return data;
    }

    const $msg = document.getElementById("msg");
    document.getElementById("forgotForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      $msg.hidden = false;
      $msg.textContent = "처리 중...";

      const email = document.getElementById("email").value.trim();
      try{
        const out = await api("/api/auth/forgot", {
          method:"POST",
          body: JSON.stringify({ email })
        });

        // ✅ 실제 서비스면 이메일 발송. 지금은 데모로 임시 비번을 화면에 출력(원하면 제거 가능)
        $msg.textContent = out.tempPassword
          ? `임시 비밀번호: ${out.tempPassword} (데모 출력)`
          : "발급 완료! 이메일을 확인해 주세요.";
      }catch(err){
        $msg.textContent = err.message || "실패";
      }
    });
  </script>
</body>
</html>
