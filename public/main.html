<script>
  /* =========================
   ✅ Nav active: 클릭 + 스크롤(확실한 방식)
========================= */
/* =========================
   ✅ Scroll Spy: #top / #news active 자동 처리
========================= */
(function () {
// ✅ 뒤로가기/페이지이동 시 스크롤 복원 막기(홈에서만)
if ("scrollRestoration" in history) {
  history.scrollRestoration = "manual";
}

// ✅ 홈으로 들어올 때(#top 또는 해시 없음) 무조건 최상단
window.addEventListener("pageshow", () => {
  if (location.hash === "" || location.hash === "#top") {
    // 두 군데 다 찍어주면 브라우저별로 더 확실함
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
    window.scrollTo(0, 0);
  }
});

  const nav = document.querySelector(".nav");
  if (!nav) return;

  const links = Array.from(nav.querySelectorAll("a"));

  const homeLink = links.find(a => a.getAttribute("href") === "#top");
  const scamLink = links.find(a => a.getAttribute("href") === "#scam-types");
  const newsLink = links.find(a => a.getAttribute("href") === "#news");

  const header = document.querySelector("header");
  const topEl = document.getElementById("top");
  const scamEl = document.getElementById("scam-types");
  const newsEl = document.getElementById("news");

  if (!header || !topEl || !scamEl || !newsEl || !homeLink || !scamLink || !newsLink) return;

  function setActive(link) {
    links.forEach(a => a.classList.remove("active"));
    link.classList.add("active");
  }

  // ✅ 관찰할 섹션 목록 (HOME / FRAUD TYPES / NEWS)
  const sections = [
    { el: topEl,  link: homeLink },
    { el: scamEl, link: scamLink },
    { el: newsEl, link: newsLink },
  ];

  // ✅ 클릭 후 스크롤 이동 중에는 스파이가 덮어쓰지 않게 잠금
  let lockUntil = 0;
  function lock(ms = 700) {
    lockUntil = Date.now() + ms;
  }

  // ✅ "화면 중앙(헤더 아래 영역)"에 더 가까운 섹션을 active로 선택
  function updateActive() {
  if (Date.now() < lockUntil) return;

  const headerH = header.getBoundingClientRect().height;
  const viewportMid = headerH + (window.innerHeight - headerH) * 0.35;

  // ✅ 맨 아래까지 내려가면 무조건 마지막 섹션(NEWS)
  const atBottom =
    window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2;
  if (atBottom) {
    setActive(newsLink);
    return;
  }

  let best = null;
  let bestDist = Infinity;

  for (const s of sections) {
    const r = s.el.getBoundingClientRect();

    // ✅ "조금이라도" 화면에 보이면 후보로 (조건 완화)
    // header 아래 영역과 겹치기만 하면 OK
    const visible = r.bottom > headerH + 1 && r.top < window.innerHeight - 1;
    if (!visible) continue;

    const center = (r.top + r.bottom) / 2;
    const dist = Math.abs(center - viewportMid);

    if (dist < bestDist) {
      bestDist = dist;
      best = s;
    }
  }

  if (best) setActive(best.link);
}

  // ✅ 스크롤/리사이즈/로드 때 갱신
  window.addEventListener("scroll", updateActive, { passive: true });
  window.addEventListener("resize", updateActive);
  window.addEventListener("load", updateActive);

  // ✅ 클릭 시: active 먼저 주고 잠금
  nav.addEventListener("click", (e) => {
  const a = e.target.closest("a");
  if (!a) return;

  const href = a.getAttribute("href");

  // ✅ HOME은 무조건 "진짜 최상단(0)"으로
  if (href === "#top") {
  e.preventDefault();
  setActive(homeLink);
  lock();

  // ✅ 강제 최상단(브라우저별 확실)
  document.documentElement.scrollTop = 0;
  document.body.scrollTop = 0;
  window.scrollTo({ top: 0, behavior: "smooth" });

  // ✅ 해시 제거(선택)
  history.replaceState(null, "", location.pathname + location.search);
  return;
}

  // 나머지는 기존 동작 그대로(영향 없음)
  if (href === "#scam-types") {
    setActive(scamLink);
    lock();
  } else if (href === "#news") {
    setActive(newsLink);
    lock();
  }
});


  // ✅ 초기/레이아웃 변동 대비
  updateActive();
  setTimeout(updateActive, 0);
  setTimeout(updateActive, 300);
  setTimeout(updateActive, 800);
})();

      ],

  const gridEl = document.getElementById("scamGrid");

  // 모달 요소
  const backdrop = document.getElementById("scamModalBackdrop");
  const modal = document.getElementById("scamModal");
  const modalTitle = document.getElementById("scamModalTitle");
  const modalIcon = document.getElementById("scamModalIcon");
  const modalDesc = document.getElementById("scamModalDesc");
  const modalRisk = document.getElementById("scamModalRisk");
  const modalSigns = document.getElementById("scamModalSigns");
  const modalTips = document.getElementById("scamModalTips");
  const btnClose = document.getElementById("scamModalClose");
  const btnOk = document.getElementById("scamModalOk");

  let lastFocusEl = null;

  function renderCards() {
  if (!gridEl) return;

  gridEl.innerHTML = SCAM_TYPES.map(t => `
    <article class="scam-card">
      <div class="scam-card-icon" aria-hidden="true">${t.icon}</div>
      <div class="scam-card-title">${t.title}</div>
      <div class="scam-card-sub">${t.short}</div>
      <button class="scam-card-btn" type="button" data-key="${t.key}">자세히 보기</button>
    </article>
  `).join("");

  // ✅ 이벤트 중복 방지: 기존 리스너 제거하려면 위임 방식으로 유지
  gridEl.onclick = (e) => {
  const btn = e.target.closest("button[data-key]");
  if (!btn) return;

  const key = btn.getAttribute("data-key");
  const data = SCAM_TYPES.find(x => x.key === key);
  if (!data) return;

  openModal(data, btn);
};
}

function fillList(ul, items) {
  ul.innerHTML = (items || []).map(x => `<li>${x}</li>`).join("");
}


  function forceCloseOnLoad(){

  // ✅ 닫기 이벤트
  backdrop.addEventListener("click", closeModal);
  btnClose.addEventListener("click", closeModal);
  btnOk.addEventListener("click", closeModal);

  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !modal.hidden) closeModal();
  });

  // ✅ 혹시 CSS가 먹통이어도 무조건 닫힌 상태로 강제
  modal.hidden = true;
  backdrop.hidden = true;

  // 혹시 style로 display가 남아있을 수 있으니 같이 제거
  modal.style.display = "none";
  backdrop.style.display = "none";

  document.documentElement.classList.remove("modal-open");
}

function openModal(data, focusReturnEl) {
  lastFocusEl = focusReturnEl || document.activeElement;

  modalIcon.textContent = data.icon;

  // ✅ 조사 보정: 받침 있으면 "이란?", 없으면 "란?"
const lastChar = data.title.at(-1);
const code = lastChar ? lastChar.charCodeAt(0) : 0;
const hasBatchim = (code >= 0xac00 && code <= 0xd7a3) ? ((code - 0xac00) % 28 !== 0) : false;

modalTitle.textContent = `${data.title}${hasBatchim ? "이란?" : "란?"}`;

  modalDesc.textContent = data.desc;

  fillList(modalRisk, data.risk);
  fillList(modalSigns, data.signs);
  fillList(modalTips, data.tips);

  // ✅ 열기
  backdrop.hidden = false;
  modal.hidden = false;
  backdrop.style.display = "block";
  modal.style.display = "grid";

  document.documentElement.classList.add("modal-open");
  btnClose.focus({ preventScroll: true });
}

function closeModal() {
  // ✅ 닫기
  modal.hidden = true;
  backdrop.hidden = true;

  modal.style.display = "none";
  backdrop.style.display = "none";

  document.documentElement.classList.remove("modal-open");

  if (lastFocusEl && typeof lastFocusEl.focus === "function") {
    lastFocusEl.focus({ preventScroll: true });
  }
}

// ✅ 초기 렌더
renderCards();

// ✅ 페이지 진입 시 무조건 닫기
forceCloseOnLoad();

/* =========================
   ✅ News: 서버(/api/news)에서 가져와 카드로 렌더
========================= */
function stripTrailingPublisher(text = "") {
  let s = String(text).trim();
  if (!s) return s;

  // 공백 정리
  s = s.replace(/\s+/g, " ").trim();

  // 1) "… - 국민일보" / "... - 네이트" / "··· - XXX"
  s = s.replace(/(?:\.\.\.|…|···)\s*[-–—]\s*[^\-–—]{1,40}\s*$/u, "").trim();

  // 2) "… 국민일보" / "... 네이트" (하이픈 없이 출처만 끝에 붙는 케이스)
  s = s.replace(/(?:\.\.\.|…|···)\s*[^\-–—]{1,40}\s*$/u, "").trim();

  // 3) " - 국민일보" / " - Nate" (제목 끝 하이픈 출처)
  s = s.replace(/\s*[-–—]\s*[^\-–—]{1,40}\s*$/u, "").trim();

  return s;
}

function cleanNewsTitle(title = "") {
  return stripTrailingPublisher(title);
}

function cleanNewsDesc(desc = "") {
  // 설명은 너무 과하게 자르면 안 되니 "끝 출처"만 제거
  return stripTrailingPublisher(desc);
}

async function loadNews() {
  const wrap = document.getElementById("newsGrid");
  if (!wrap) return;

  // 로딩 UI
  wrap.innerHTML = `
    <article class="news-card skeleton"></article>
    <article class="news-card skeleton"></article>
    <article class="news-card skeleton"></article>
  `;

  try {
    const r = await fetch("/api/news");
    const data = await r.json();

    if (!data.ok || !Array.isArray(data.items)) {
      throw new Error(data.message || "invalid response");
    }

    const items = data.items.slice(0, 3); // ✅ 사진처럼 3개만

    wrap.innerHTML = items.map((it) => {
  const title = cleanNewsTitle((it.title || "").trim());
const desc  = cleanNewsDesc((it.description || "").trim());

  return `
    <a class="news-card" href="${it.link}" target="_blank" rel="noopener noreferrer">
      <div class="news-title">${escapeHtml(title)}</div>
      ${desc ? `<div class="news-desc">${escapeHtml(desc)}</div>` : ""}
      <div class="news-meta">
        <span class="news-source">${escapeHtml(it.source || "")}</span>
        <span class="news-dot">·</span>
        <span class="news-date">${formatDate(it.pubDate)}</span>
      </div>
    </a>
  `;
}).join("");

  } catch (e) {
    wrap.innerHTML = `
      <div class="news-empty">
        뉴스를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.
      </div>
    `;
    console.error(e);
  }
}

// XSS 방지(최소)
function escapeHtml(s = "") {
  return String(s)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function formatDate(s) {
  const t = Date.parse(s);
  if (!t) return "";
  const d = new Date(t);
  return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
}

// ✅ 실행
loadNews();
</script>
