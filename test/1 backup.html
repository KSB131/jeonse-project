<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Portfolio</title>
  <style>
    :root{
    --nav-h: 78px;
    --nav-bg: #0f6a86;
    --ink: #eaf6ff;
    --muted: rgba(255,255,255,.8);
    --line: rgba(255,255,255,.18);
    --accent: #55d7ff;
  }

  *{ box-sizing: border-box; }
  body{ margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", sans-serif; background:#fff; }

    /* ===== Header ===== */
    header{
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--nav-bg);
      border-bottom: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 2px 0 rgba(0,0,0,.05);
    }

    .topbar{
      height: var(--nav-h);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 0 18px;
      position: relative;
    }

    .brand{
      position:absolute;
      left:50%;
      transform: translateX(-50%);
      color: var(--ink);
      font-weight: 650;
      letter-spacing:.3px;
      font-size: 22px; /* 스샷처럼 조금 작게 */
      text-shadow: 0 1px 0 rgba(0,0,0,.25);
    }

    .icon-btn{
      width: 44px;
      height: 44px;
      display:grid;
      place-items:center;
      border: 0;
      background: transparent;
      cursor:pointer;
      color: var(--ink);
      opacity:.95;
    }
    .icon-btn:hover{ opacity:1; }

    .nav{
      display:flex;
      gap: 22px;
      padding: 0 18px 10px;
      align-items:flex-end;
    }

    .nav a{
      color: var(--ink);
      text-decoration: none;
      font-weight: 700;
      font-size: 11px; /* 스샷처럼 작게 */
      letter-spacing: .6px;
      opacity:.95;
      padding: 10px 2px 10px;
      position: relative;
    }
    .nav a:hover{ opacity:1; }

    .nav a.active::after{
      content:"";
      position:absolute;
      left:0; right:0; bottom:0;
      height: 3px;
      background: var(--accent);
      border-radius: 999px;
    }

    /* ===== Hero ===== */
    .hero{
    min-height: 520px;
    position:relative;
    overflow:hidden;

    /* ✅ 사진으로 배경 채우기 */
    background-image: url("../src/image/house.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  /* ✅ 반투명 오버레이(별/그라데이션 제거) */
  .hero::before{
    content:"";
    position:absolute;
    inset:0;
    background: rgba(0,0,0,.35); /* 투명도 조절 */
    pointer-events:none;
    z-index: 1;
  }

  /* moon / text는 오버레이보다 위로 */
  .moon{ z-index: 3; }
  .hero-inner{ z-index: 4; position:relative; }

  /* ✅ 산 배경 제거 */
  .mountains{ display:none; }

    /* ===== Hero content 배치 핵심 ===== */
    .hero-inner{
      position:relative;
      z-index: 4;                 /* 텍스트/이미지가 산보다 위 */
      max-width: 980px;
      margin: 0 auto;
      padding: 48px 18px 0;       /* ✅ 제목을 위로 올림 (기존 64px → 48px) */
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      gap: 14px;
    }

    .hero h1{
      margin: 8px 0 0;            /* ✅ 제목 상단 여백 줄여서 더 위로 */
      color: #f6fdff;
      font-weight: 800;
      font-size: clamp(28px, 4vw, 44px);  /* 스샷처럼 한 번 더 컴팩트 */
      line-height: 1.06;
      text-shadow: 0 4px 24px rgba(0,0,0,.25);
    }

    /* 집 사진(✅ 원하는 위치에 고정) */
    .hero-image{
    width: min(520px, 82vw);
    aspect-ratio: 628 / 415;
    border-radius: 2px;
    overflow:hidden;
    box-shadow: 0 12px 28px rgba(0,0,0,.28);
    margin-top: 6px;
    transform: translateY(6px);
  }
  .hero-image img{ width:100%; height:100%; object-fit: cover; display:block; }

    /* 산(SVG) */
    .mountains{
      position:absolute;
      left:0; right:0; bottom:-2px;
      width:100%;
      height: 260px;
      z-index: 2;
      pointer-events:none;
    }

    /* 아래 흰 영역(스샷 느낌) */
    .section{
      padding: 46px 16px 70px;
      text-align:center;
      border-top: 1px solid #eef2f5;
      background:#fff;
    }
    .section h2{
      margin:0;
      font-size: 22px;
      font-weight: 500;
      color:#222;
    }

    @media (max-width: 720px){
      :root{ --nav-h: 72px; }
      .brand{ font-size: 20px; }
      .nav{ gap: 18px; overflow:auto; }
      .moon{ left: 110px; top: 88px; transform: scale(.92); }
      .hero-inner{ padding-top: 42px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="topbar">
      <button class="icon-btn" aria-label="메뉴">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <div class="brand">Portfolio</div>

      <button class="icon-btn" aria-label="검색">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="currentColor" stroke-width="2"/>
          <path d="M16.3 16.3 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <nav class="nav" aria-label="상단 메뉴">
      <a class="active" href="#">HOME</a>
      <a href="#">TEAM</a>
      <a href="#">ARCHIVE</a>
      <a href="#">CONTACT</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="moon" aria-hidden="true"></div>

      <div class="hero-inner">
        <!-- ✅ (2) 제목을 위로 올린 상태 -->
        <h1>We strive to greet<br/>a better future.</h1>

      </div>

      <!-- Mountains / sun / birds -->
      <svg class="mountains" viewBox="0 0 1440 320" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,230 C240,210 380,260 600,240 C820,220 980,260 1200,245 C1320,237 1390,235 1440,240 L1440,320 L0,320 Z"
              fill="rgba(255,255,255,.35)"/>
        <path d="M0,260 L180,210 L340,250 L520,180 L720,250 L900,200 L1080,260 L1260,215 L1440,260 L1440,320 L0,320 Z"
              fill="#aebccd"/>
        <path d="M180,210 L120,235 L150,232 L165,245 L180,238 L200,252 L225,248 L240,262 L340,250 Z"
              fill="#f6fbff" opacity=".95"/>
        <path d="M0,290 L140,260 L300,290 L430,250 L560,290 L690,250 L860,300 L980,265 L1120,300 L1260,270 L1440,305 L1440,320 L0,320 Z"
              fill="#95a8bb"/>

        <path d="M0,320 L0,265 L90,225 L170,245 L260,210 L360,250 L520,320 Z"
              fill="#8fa4b8"/>
        <path d="M90,225 L40,256 L70,252 L86,265 L105,252 L126,274 L155,270 L170,245 Z"
              fill="#ffffff" opacity=".95"/>

        <path d="M820,320 L940,260 L1020,285 L1110,230 L1200,255 L1320,215 L1440,270 L1440,320 Z"
              fill="#7f97ad"/>
        <path d="M1320,215 L1270,238 L1295,236 L1310,250 L1332,240 L1355,262 L1390,256 L1440,270 Z"
              fill="#ffffff" opacity=".95"/>

        <circle cx="1040" cy="270" r="54" fill="#ffd5c2" opacity=".9"/>
        <circle cx="1040" cy="270" r="54" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>

        <path d="M980,205 q16,-10 32,0" stroke="rgba(255,255,255,.85)" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M1018,205 q16,-10 32,0" stroke="rgba(255,255,255,.75)" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
    </section>

    <section class="section">
      <h2>I am a positive person</h2>
    </section>
  </main>
</body>
</html>
